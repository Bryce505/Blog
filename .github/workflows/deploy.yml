name: deploy

on:
  push:
    branches: [master]
    paths-ignore: ['drafts/**', 'pipeline/**', 'docs/**', 'design/**', 'README.md']
  # publish 提交文章后必须接着部署。workflow 用内置 GITHUB_TOKEN 推的提交
  # 不会触发其他 workflow（GitHub 防递归的安全规则），所以光靠上面的 push
  # 触发，每晚发的文章会一直躺在仓库里不上线。
  # sync-reports 与 sync-clips 同理：它们推的周报与剪藏也得靠这条才上线。
  workflow_run:
    workflows: [publish, sync-reports, sync-clips]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # publish 失败时不必白跑一次构建
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
