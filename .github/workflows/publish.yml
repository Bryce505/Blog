name: publish

on:
  schedule:
    # 故意不选整点。实测 2026-08-25～27 三天的 schedule 触发记录：延迟
    # 41 分钟、46 分钟、第三天 90 分钟仍未触发（同一时间窗口里另外两次
    # workflow_dispatch 都正常秒开）——延迟逐日变长，跟 GitHub 官方文档
    # 说明的一致："High load times include the start of every hour. To
    # decrease the chance of delay, schedule your workflow to run at a
    # different time of the hour." 整点是全平台最挤的一分钟，这条 cron
    # 恰好卡在那一分钟上。挪开整点不能保证零延迟，但去掉了「自己选了最差
    # 时段」这个可控因素。
    - cron: '13 13 * * *'     # UTC 13:13 = 北京时间 21:13
    # 备份触发：躲开整点仍不保证一定按时触发（GitHub 自己的文档原话是
    # "can be delayed"，没有承诺上限；排查当天那次延迟到本文写下时已经
    # 超过 90 分钟，比前两天都久，不能排除当次被跳过而不只是延迟）。两点
    # 几个小时错开，同一天再挤也不太可能两条都撞上高峰。两条都落到同一个
    # concurrency group（见下）串行执行，不会并发写 published.json；正常
    # 情况下第一条已经发过，第二条只是选材、烧一次 DeepSeek 调用后再发一篇
    # ——本仓库同一天出多篇是常态（见 published.json 实际记录），不是异常。
    - cron: '37 15 * * *'     # UTC 15:37 = 北京时间 23:37，备份
    # 临时诊断点，不是常设第三条触发：上面那条备份触发（UTC 15:37）等了
    # 整 60 分钟没有出现，比这条改动生效前两次成功触发的延迟（41、46
    # 分钟）都久——但样本只有一次，且改动落地到 15:37 只隔了不到一小时，
    # 不能排除是调度还没拿到最新配置。这条卡 UTC 17:23（离改动落地约
    # 2.5 小时）专门用来多攒一个样本，用完即删，不留在常设配置里。
    - cron: '23 17 * * *'     # UTC 17:23，诊断用，验证后移除
  push:
    paths: ['drafts/**']      # 往 drafts/ 扔稿子即刻处理
  workflow_dispatch:
    inputs:
      mode:
        description: 跑哪条通道
        type: choice
        options: [seed, manual, auto]
        default: seed
      count:
        description: 本次发布的篇数（seed / auto 通道）
        default: '1'
      publish:
        description: 校验全过就直接发布（不勾则一律带 draft 标等人工放行）
        type: boolean
        default: true
      refresh_index:
        description: 补图前强制重建 Drive 索引（刚往 Drive 补传了图就勾上）
        type: boolean
        default: false

permissions:
  contents: write
  issues: write               # 校验未通过时开 issue 通知

concurrency:
  group: publish
  cancel-in-progress: false   # 两次运行同时写 published.json 会打架

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'manual' || 'seed') }}
      COUNT: ${{ github.event.inputs.count || 1 }}
      # 手动触发时不勾「直接发布」就一律带 draft 标；定时与 drafts 推送默认直接发布
      PUBLISH: ${{ github.event.inputs.publish == 'false' && '' || '--publish' }}
    steps:
      - uses: actions/checkout@v4

      # 两个源仓库都是私有的，必须用 PAT
      - uses: actions/checkout@v4
        with:
          repository: Bryce505/Obsidian-base
          token: ${{ secrets.VAULT_TOKEN }}
          path: .vault
      - uses: actions/checkout@v4
        with:
          repository: Bryce505/RoutineRun
          token: ${{ secrets.VAULT_TOKEN }}
          path: .routinerun

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r pipeline/requirements.txt

      - name: 工具与效率栏目
        run: python pipeline/main.py --routinerun .routinerun --blog . | tee -a report.json

      # 放在发文前面：补图会顺手刷新 Drive 索引缓存，后面发新文直接复用
      - name: 给已发布文章补图
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python pipeline/main.py --repair-images --blog . \
            ${{ github.event.inputs.refresh_index == 'true' && '--refresh-index' || '' }} \
            | tee -a report.json

      - name: 发文
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          case "$MODE" in
            manual) ARGS="--manual" ;;
            auto)   ARGS="--count $COUNT" ;;
            *)      ARGS="--seed --count $COUNT" ;;
          esac
          python pipeline/main.py --vault .vault --blog . $ARGS $PUBLISH | tee -a report.json

      - name: 提交产出
        run: |
          rm -rf .vault .routinerun
          git config user.name  'blog-bot'
          git config user.email 'makejun505@gmail.com'
          # 逐个添加：git add 遇到任一不存在的路径会整条中止、一个文件都不暂存。
          for p in src/content/posts public/images published.json \
                   pipeline/drive_index.json drafts logs; do
            [ -e "$p" ] && git add -A "$p"
          done
          if git diff --staged --quiet; then
            echo '本次没有新产出'
          else
            git commit -m "自动发布：$(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: report.json
          if-no-files-found: ignore
