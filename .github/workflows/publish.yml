name: publish

on:
  schedule:
    - cron: '0 13 * * *'      # UTC 13:00 = 北京时间 21:00
  push:
    paths: ['drafts/**']      # 往 drafts/ 扔稿子即刻发布
  workflow_dispatch:
    inputs:
      count:
        description: 本次自动通道发布的篇数
        default: '1'
      refresh_index:
        description: 补图前强制重建 Drive 索引（刚往 Drive 补传了图就勾上）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false   # 两次运行同时写 published.json 会打架

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 两个源仓库都是私有的，必须用 PAT
      - uses: actions/checkout@v4
        with:
          repository: Bryce505/Obsidian-base
          token: ${{ secrets.VAULT_TOKEN }}
          path: .vault
      - uses: actions/checkout@v4
        with:
          repository: Bryce505/RoutineRun
          token: ${{ secrets.VAULT_TOKEN }}
          path: .routinerun

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r pipeline/requirements.txt

      - name: 处理 drafts（两种触发都先跑）
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python pipeline/main.py --drafts --blog . | tee -a report.json

      - name: 工具与效率栏目
        run: python pipeline/main.py --routinerun .routinerun --blog . | tee -a report.json

      # 放在自动通道前面：补图会顺手刷新 Drive 索引缓存，后面发新文直接复用
      - name: 给已发布文章补图
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python pipeline/main.py --repair-images --blog . \
            ${{ github.event.inputs.refresh_index == 'true' && '--refresh-index' || '' }} \
            | tee -a report.json

      - name: 自动通道发文（仅定时与手动触发）
        if: github.event_name != 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python pipeline/main.py --vault .vault --blog . \
            --count "${{ github.event.inputs.count || 1 }}" | tee -a report.json

      - name: 提交产出
        run: |
          rm -rf .vault .routinerun
          git config user.name  'blog-bot'
          git config user.email 'makejun505@gmail.com'
          # 逐个添加：git add 遇到任一不存在的路径会整条中止、一个文件都不暂存。
          # 校验失败时 published.json 不会生成，之前因此把 _review/ 里的文章和
          # 刚从 Drive 取回的图片一起丢了。
          for p in src/content/posts public/images published.json \
                   pipeline/drive_index.json _review drafts; do
            [ -e "$p" ] && git add -A "$p"
          done
          if git diff --staged --quiet; then
            echo '本次没有新产出'
          else
            git commit -m "自动发布：$(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: report.json
          if-no-files-found: ignore
