name: publish

on:
  schedule:
    # 故意不选整点：GitHub 官方文档明说整点前后是全平台负载最高的时段，
    # 排队最容易延迟。这条改动本身没有证实有效——详见下面「实测状态」，
    # 如实记着，不要看着像修好了就删掉这段。
    - cron: '13 13 * * *'     # UTC 13:13 = 北京时间 21:13
    # 备份触发，跟主触发隔几个小时，降低「同一天两条都撞上同一波拥堵」的
    # 概率。两条共享下面的 concurrency group，串行执行不会撞车；正常情况
    # 下第一条已经发过，第二条最多是同一天多发一篇，不算异常（见
    # published.json 里本来就有的单日多篇记录）。
    - cron: '37 15 * * *'     # UTC 15:37 = 北京时间 23:37，备份
    #
    # 实测状态（2026-08-27，详见 docs/devlog/2026-08-27-定时任务整点排队延迟.md）：
    # 这次改动生效当天试了两个新时段（15:37 备份、17:23 临时诊断，后者已
    # 按计划移除），各等了整 60 分钟，一次都没触发；改动之前的整点 cron
    # 当天第一次也是一整天没触发。三个时段全军覆没，不能算「挪开整点就
    # 好了」。真正说明问题的是隔天（改动生效满 23 小时后）的主触发是否
    # 按时出现——如果那次仍然长时间不触发，说明问题不在整点、这条 cron
    # 改动不够，需要考虑绕开 GitHub 自己 schedule 队列的方案（外部服务
    # 定时调用 workflow_dispatch）。改这段配置前先去 devlog 看最新结论。
  push:
    paths: ['drafts/**']      # 往 drafts/ 扔稿子即刻处理
  workflow_dispatch:
    inputs:
      mode:
        description: 跑哪条通道
        type: choice
        options: [seed, manual, auto]
        default: seed
      seed_url:
        description: >-
          seed 通道指定这一篇当引子：在 Obsidian-base 里翻到笔记后复制它的
          GitHub 链接粘过来即可（裸的 vault 内相对路径也行）；留空则自动挑
        default: ''
      count:
        description: 本次发布的篇数（seed / auto 通道，指定了 seed_url 时不生效）
        default: '1'
      publish:
        description: 校验全过就直接发布（不勾则一律带 draft 标等人工放行）
        type: boolean
        default: true
      refresh_index:
        description: 补图前强制重建 Drive 索引（刚往 Drive 补传了图就勾上）
        type: boolean
        default: false

permissions:
  contents: write
  issues: write               # 校验未通过时开 issue 通知

concurrency:
  group: publish
  cancel-in-progress: false   # 两次运行同时写 published.json 会打架

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'manual' || 'seed') }}
      COUNT: ${{ github.event.inputs.count || 1 }}
      SEED_URL: ${{ github.event.inputs.seed_url }}
      # 手动触发时不勾「直接发布」就一律带 draft 标；定时与 drafts 推送默认直接发布
      PUBLISH: ${{ github.event.inputs.publish == 'false' && '' || '--publish' }}
    steps:
      - uses: actions/checkout@v4

      # 两个源仓库都是私有的，必须用 PAT
      - uses: actions/checkout@v4
        with:
          repository: Bryce505/Obsidian-base
          token: ${{ secrets.VAULT_TOKEN }}
          path: .vault
      - uses: actions/checkout@v4
        with:
          repository: Bryce505/RoutineRun
          token: ${{ secrets.VAULT_TOKEN }}
          path: .routinerun

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r pipeline/requirements.txt

      - name: 工具与效率栏目
        run: python pipeline/main.py --routinerun .routinerun --blog . | tee -a report.json

      # 放在发文前面：补图会顺手刷新 Drive 索引缓存，后面发新文直接复用
      - name: 给已发布文章补图
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python pipeline/main.py --repair-images --blog . \
            ${{ github.event.inputs.refresh_index == 'true' && '--refresh-index' || '' }} \
            | tee -a report.json

      - name: 发文
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          # SEED_URL 不加引号直接展开：GitHub 链接本身是 percent-encoded，
          # 不会有裸空格，跟其余分支保持同样「无引号展开」的写法，不为了
          # 防一个不会发生的输入去引入更复杂的引用规则。
          case "$MODE" in
            manual) ARGS="--manual" ;;
            auto)   ARGS="--count $COUNT" ;;
            *)
              if [ -n "$SEED_URL" ]; then
                ARGS="--seed-url $SEED_URL"
              else
                ARGS="--seed --count $COUNT"
              fi
              ;;
          esac
          python pipeline/main.py --vault .vault --blog . $ARGS $PUBLISH | tee -a report.json

      - name: 提交产出
        run: |
          rm -rf .vault .routinerun
          git config user.name  'blog-bot'
          git config user.email 'makejun505@gmail.com'
          # 逐个添加：git add 遇到任一不存在的路径会整条中止、一个文件都不暂存。
          for p in src/content/posts public/images published.json \
                   pipeline/drive_index.json drafts logs; do
            [ -e "$p" ] && git add -A "$p"
          done
          if git diff --staged --quiet; then
            echo '本次没有新产出'
          else
            git commit -m "自动发布：$(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: report.json
          if-no-files-found: ignore
